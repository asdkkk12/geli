name: Publish container images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize releases so two runs do not update the main tags concurrently.
concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:monitoring

  publish:
    name: Publish ${{ matrix.image }}
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: geli-api
            dockerfile: deploy/docker/api.Dockerfile
          - image: geli-agent
            dockerfile: deploy/docker/agent.Dockerfile
          - image: geli-web
            dockerfile: deploy/docker/web.Dockerfile
          - image: geli-workspace
            dockerfile: deploy/images/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
        run: echo "name=ghcr.io/${OWNER,,}/${IMAGE}" >> "$GITHUB_OUTPUT"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Record published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          REVISION: ${{ github.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'Published: `%s:%s`\n\nDigest: `%s@%s`\n' "$IMAGE" "$REVISION" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
